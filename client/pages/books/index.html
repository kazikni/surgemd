<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book</title>
    </head>
    <body>
        <div class="book-container">
            <div class="book">
                <div class="page page-left" id="leftPage">
                    <h1 class="title"></h1>
                    <img class="image">
                    <p class="text"></p>
                </div>
                <div class="page page-right" id="rightPage">
                    <h1 class="title"></h1>
                    <img class="image">
                    <p class="text"></p>
                </div>
                <div class="flip-page" id="flipPage">
                    <div class="flip-front page" id="flip-front">
                        <h1 class="title"></h1>
                        <img class="image">
                        <p class="text"></p>
                    </div>
                    <div class="flip-back page" id="flip-back">
                        <h1 class="title"></h1>
                        <img class="image">
                        <p class="text"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="prev">◀ Previous</button>
            <button id="next">Next ▶</button>
        </div>
        <script type="module" src="src/main.ts"></script>
    </body>
</html>
