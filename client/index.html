<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content=".IO Game Powered In KLSE" />
  
    <meta property="og:title" content="Surgemd.io"/>
    <meta property="og:description" content=".IO Game Powered In KLSE" />
    <meta
      property="og:image"
      content="img/menu/logos/embed.png"
    />

    <title>Surgemd</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="/scripts/extra_elements.js"></script>
    <link rel="stylesheet" href="/scripts/extra_elements.css">
  </head>
  <body>
    <script type="module" src="./src/scripts/others/index.ts" async></script>
    <div id="game" style="display: none;">
      <div>
        <div id="game-gui">
          <div id="game-mobile-gui" style="display: none; pointer-events: none;">
            <kl-joystick id="left-joystick"></kl-joystick>
            <kl-joystick id="right-joystick"></kl-joystick>
            <div id="mobile-action-buttons">
              <button id="btn-mobile-interact" class="btn-dark-green"><div></div></button>
              <button id="btn-mobile-reload" style="display:none;pointer-events: none;" class="btn-dark-green"><div></div></button>
            </div>
          </div>
          <div id="emote-wheel" class="emote-wheel">
            <img src="/img/game/common/loadout/emotes/emote_happy.svg" id="emote-wheel-top" class="emote-wheel-part wheel-part-top"></img>
            <img src="/img/game/common/loadout/emotes/emote_md_logo.svg" id="emote-wheel-bottom" class="emote-wheel-part wheel-part-bottom"></img>
            <img src="/img/game/common/loadout/emotes/emote_sad.svg" id="emote-wheel-left" class="emote-wheel-part wheel-part-left"></img>
            <img src="/img/game/common/loadout/emotes/emote_neutral.svg" id="emote-wheel-right" class="emote-wheel-part wheel-part-right"></img>
            <img src="/img/menu/gui/emote_wheel_hover_center.svg" id="emote-wheel-hover" class="wheel-hover wheel-hover-center"></img>
          </div>
          <div id="help-gui">
          </div>
          <div id="bars-container">
            <div id="health-bar-container">
              <div id="health-bar-basic-heal"></div>
              <div id="health-bar-animation"></div>
              <div id="health-bar"></div>
              <span id="health-bar-amount">100/100</span>
            </div>
            <div id="boost-bar-container">
              <div id="boost-bar"></div>
              <span id="boost-bar-amount">100/100</span>
            </div>
          </div>
          <div id="bottom-left-container">
            <div>
              <img id="hand-info-consume-type"></img>
              <span id="hand-info-count"></span>
            </div>
            <div id="action-info">
              <span id="action-info-delay">1s</span>
            </div>
          </div>
          <div id="information-container">
            <div id="killfeed-container"></div>
            <div id="information-killbox" class="background-menu"></div>
            <div id="information-interaction" class="background-menu"></div>
            <div id="killeader-container">
              <img width="30" height="30" src="img/menu/icons/aim.svg" id="killeader-container-icon"><img>
              <span id="killeader-text">Waiting For The Killleader</span>
            </div>
            <div id="debug-show">60 FPS<br>60 ping</div>
          </div>
          <div id="inventory-container">
            <div id="ui-items">
            </div>
            <div id="ui-weapons">
            </div>
            <div id="ui-aitems">
            </div>
            <div id="ui-iitems">
            </div>
          </div>  
        </div>
        <div id="gameover-container">
          <div id="gameover-main-message">
          </div>
          <div id="gameover-buttons">
            <button id="gameover-menu-btn" class="btn-blue">Return To Menu</button>
            <button id="gameover-status-btn" class="btn-blue">Status</button>
            <button id="gameover-report-btn" class="btn-blue">Report Player</button>
          </div>
        </div>
      </div>  
      <canvas id="game-canvas"></canvas>
      <div id="bloom-gfx"></div>
      <div id="tiltshift-gfx"></div>
      <div id="recolor-gfx"></div>
    </div>
    <div id="menu">
      <div id="menu-background-effects">
        <div id="menu-bullets"></div>
      </div>
      <div id="menu-options">
      </div>

      </div>

                <div>

                </div>
                <div>

              </div>
              <div class="background-menu-md background-menu-ss background-menu" id="settings-sm-sounds">

    <div id="both-ui">
      <div id="loading-screen">
        <div id="loading-screen-logo"></div>
        <p id="loading-screen-span" class="span">Loading...</p>
        <div id="loading-hint" class="loading-background">
          <p id="loading-hint-span" class="span">Barrels Explode</p>
        </div>
        <div id="loading-current" class="loading-background">
        </div>
      </div>
      <div id="initial-screen"></div>
