<!DOCTYPE html>
<html translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content=".IO Game Powered In KLSE" />
    
        <meta property="og:title" content="Surgemd.io"/>
        <meta property="og:description" content=".IO Game Powered In KLSE" />
        <meta
            property="og:image"
            content="img/menu/logos/embed.png"
        />
        <meta name="google" content="notranslate">

        <title>Surgemd</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <script src="/scripts/extra_elements.js"></script>
        <link rel="stylesheet" href="/scripts/extra_elements.css">
    </head>
    <body>
        <script type="module" src="./src/scripts/others/index.ts" async></script>
        <div id="game" style="display: none;">
            <canvas id="game-canvas" class="game-canvas"></canvas>
            <div id="tiltshift-gfx"></div>
            <div>
                <div id="game-gui" style="display:none;visibility:none;pointer-events:none;">
                    <div id="game-mobile-gui" style="display: none; pointer-events: none;">
                        <kl-joystick id="left-joystick"></kl-joystick>
                        <kl-joystick id="right-joystick"></kl-joystick>
                        <div id="mobile-action-buttons">
                            <button id="btn-mobile-interact" class="btn-dark-green"></button>
                            <button id="btn-mobile-reload" style="display:none;pointer-events: none;" class="btn-dark-green"></button>
                            <button id="btn-mobile-emotes" class="btn-dark-green"></button>
                        </div>
                    </div>
                    <div id="help-gui"></div>
                    <div id="bottom-left-container">
                        <div id="action-info">
                            <span id="action-info-delay">1s</span>
                        </div>
                        <div id="hand-info">
                            <img id="hand-info-consume-type"></img>
                            <span id="hand-info-count"></span>
                        </div>
                        <div id="boost-bar-container">
                            <div id="boost-bar"></div>
                            <span id="boost-bar-amount">100/100</span>
                        </div>
                        <div id="health-bar-container">
                            <div id="health-bar-basic-heal"></div>
                            <div id="health-bar-animation"></div>
                            <div id="health-bar"></div>
                            <span id="health-bar-amount">100/100</span>
                        </div>
                    </div>
                    <div id="information-container">
                        <div id="feed-container"></div>
                        <div id="information-box-container">
                            <div id="information-killbox"></div>
                            <div id="information-interaction"></div>
                        </div>
                        <div id="debug-show" class="span-text"></div>
                    </div>
                    <div id="inventory-container">
                        <div id="ui-items"></div>
                        <div id="ui-weapons"></div>
                        <div id="ui-aitems"></div>
                        <div id="ui-iitems"></div>
                        <div id="ui-equipment"></div>
                    </div>
                    <div id="top-info-container">
                        <div id="additional-info">
                            <div>
                                <div id="living-count-main"></div>
                                <img src="/img/menu/icons/human.svg" draggable="false">
                            </div>
                            <div>
                                <span  id="kills-info" class="span-text-base">0</span>
                                <img src="/img/menu/icons/aim.svg" draggable="false">
                            </div>
                            <div id="deadzone-info">
                                <span id="deadzone-info-timer"></span>
                                <span id="deadzone-info-state"></span>
                                <img draggable="false" id="deadzone-info-icon">
                            </div>
                        </div>
                        <div id="ui-map">
                            <div class="map-viewport">
                                <div class="map-tiles"></div>

                                <div class="map-deadzone"></div>
                                <div class="map-deadzone-dest"></div>
                                <div class="map-deadzone-safe-line"></div>

                                <div class="map-pings"></div>
                                <div class="map-players"></div>
                            </div>
                        </div>
                        <div id="leader-container">
                            <span id="leader-text">Waiting For The Leader</span>
                            <div id="leader-container-icon"></div>
                        </div>
                    </div>
                    <div id="item-tooltip">
                        <div id="item-tooltip-title"></div>
                        <div id="item-tooltip-description"></div>
                    </div>
                    <div id="emote-wheel" class="emote-wheel">
                        <img id="emote-wheel-top" class="emote-wheel-part wheel-part-top"></img>
                        <img id="emote-wheel-bottom" class="emote-wheel-part wheel-part-bottom"></img>
                        <img id="emote-wheel-left" class="emote-wheel-part wheel-part-left"></img>
                        <img id="emote-wheel-right" class="emote-wheel-part wheel-part-right"></img>
                        <img id="emote-wheel-hover" class="wheel-hover wheel-hover-center"></img>
                    </div>
                </div>
            </div>
            <div id="normal-gameover-container">
                <div id="gameover-status-container"></div>
                    <div id="gameover-main-message">Press R To Restart</div>
                    <div id="gameover-buttons">
                        <button id="gameover-menu-btn" class="btn-blue">Return To Menu</button>
                        <button id="gameover-status-btn" class="btn-blue">Status</button>
                        <button id="gameover-report-btn" class="btn-blue">Report Player</button>
                </div>
            </div>
            <div id="restart-gameover-container" class="hidden"><span id="go-message">Press R To Restart</span></div>
        </div>
        <div id="menu">
            <div id="menu-background-effects"></div>
            <div id="menu-options"></div>
            <div id="menu-content"></div>
            <div id="featured-content-creators" class="span-text"></div>
            <p id="game-version" class="span-text">Beta 1.0</p>
        </div>
        <div id="both-ui">
            <div id="loading-screen">
                <div id="loading-screen-logo-container">
                    <div id="loading-screen-logo"></div>
                    <p id="loading-screen-span" class="span">Loading...</p>
                </div>
                <div id="loading-hint" class="loading-background">
                    <p id="loading-hint-span" class="span">Barrels Explode</p>
                </div>
                <div id="loading-current" class="loading-background"></div>
            </div>
            <div id="initial-screen">
                <video id="intro-video" playsinline autoplay muted width="640">
                    <source src="videos/intro.mp4" type="video/mp4">
                </video>
            </div>
            <div id="text-gameover-container" style="opacity:0;pointer-events:none;visibility:hidden;">
                <div class="tv-static"></div>
                <p id="text-gameover"></p>
            </div>
            <div id="history-overlay" style="opacity:0;pointer-events:none;visibility:hidden;">
                <div class="tv-static"></div>
                <div id="history-container">
                    <img id="history-frame">
                </div>
                <div id="history-dialog">
                    <div id="history-dialog-text" style="pointer-events:none;display:none" class="dialog-box">
                        <p class="name"></p>
                        <p class="content"></p>
                    </div>
                    <div id="history-dialog-indicator" style="pointer-events:none;display:none">▶</div>
                </div>
            </div>
            <div id="phase-intro-overlay" style="display:none;visibility:none;pointer-events:none;">
                <div class="tv-static"></div>
                    <div id="phase-intro-content">
                    <div id="phase-intro-name"></div>
                    <div id="phase-intro-location"></div>
                    <div id="phase-intro-date"></div>
                    <div id="phase-intro-description"></div>
                </div>
            </div>
            <div id="vignetting-gfx"></div>
        </div>
    </body>
</html>
